name: pack-acceptance

# File do gói `web-api-ts` của X-Templates sở hữu (install.py --pack; manifest ghi hash): chưa sửa → cài lại cập nhật tại
# chỗ; đã sửa → bản mới ở `pack-acceptance.yml.xtemplates-new` để gộp tay. Chạy bộ nghiệm thu (`test` của xt.yaml qua
# dev-task.sh) với Postgres thật, rồi build artifact có digest (`build`). Thêm vào required check của ruleset khi xanh ổn định.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  acceptance:
    name: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-trixie@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          # Không literal mật khẩu (BASE-SEC-005): CSDL rỗng dùng một lần trên runner tạm — xác thực trust.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bộ nghiệm thu (lệnh `test` của xt.yaml)
        env:
          # Ngữ cảnh `job` chỉ có ở `steps[*].env`, không ở `jobs.<id>.env` — đặt ở job làm cả workflow không hợp lệ.
          PG_TOOLS_CONTAINER: ${{ job.services.postgres.id }}
        run: .xtemplates/scripts/dev-task.sh test
      - name: Artifact có digest (lệnh `build` của xt.yaml)
        run: .xtemplates/scripts/dev-task.sh build
