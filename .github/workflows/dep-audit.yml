name: Dependency audit

# Quét lỗ hổng phụ thuộc (BASE-DEP-004): Python (job `dep-audit`) và lockfile pnpm của gói web-api-ts (job `pack-npm-audit`) — mỗi PR, push main, hằng tuần và chạy tay.
# Khung chỉ dùng thư viện chuẩn lúc chạy; các gói ở đây là công cụ cổng (requirements-dev.txt) và chính pip-audit. Gói E2E (requirements-e2e.txt, D-133) chỉ chạy ở job `app-e2e`.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dep-audit:
    name: dep-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # job không push (AUD-CI-028)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Cài pip-audit và zizmor kèm hash
        run: pip install --quiet --require-hashes -r requirements-audit.txt
      - name: Quét lỗ hổng (đỏ khi có lỗ hổng đã biết)
        run: pip-audit --require-hashes --strict --disable-pip -r requirements-dev.txt -r requirements-audit.txt -r requirements-e2e.txt
      # SBOM CycloneDX của mọi gói công cụ đã khoá (AUD-DEP-010): pip-audit 2.10.1 luôn ghi định dạng cyclonedx (is_manifest,
      # đọc mã 2026-11-02) — chạy sau bước quét nên chỉ có SBOM khi quét xanh.
      - name: SBOM CycloneDX (requirements-*.txt)
        run: pip-audit --require-hashes --strict --disable-pip -r requirements-dev.txt -r requirements-audit.txt -r requirements-e2e.txt -f cyclonedx-json -o sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 90
      # Lint workflow (CL-5, T-1833): zizmor 1.31.1 chạy offline (không gọi GitHub API, không cần token), persona regular,
      # chỉ đỏ khi có finding mức high; ngoại lệ đã có lý do ngay tại workflow (`# zizmor: ignore[...]`).
      - name: Lint workflow bằng zizmor (đỏ khi có finding high)
        run: zizmor --offline --persona regular --min-severity high .github/workflows

  # Lockfile npm của gói web-api-ts (AUD-DEP-021, D-427): chép sang mọi dự án đích nên quét như phụ thuộc Python (BASE-DEP-004).
  # `pnpm audit` gọi endpoint advisory của registry npm (cùng registry mà `pnpm install` đã dùng); pnpm ghim cùng bản với
  # pack-web-api.yml. Chỉ đọc lockfile: không cài gói, không chạy mã của gói.
  pack-npm-audit:
    name: pack-npm-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # job không push (AUD-CI-028)
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Quét lockfile của gói (đỏ khi có advisory mức vừa trở lên)
        working-directory: framework/templates/packs/web-api-ts/starter
        run: pnpm audit --audit-level moderate
