name: Dependency audit

# Quét lỗ hổng phụ thuộc Python (BASE-DEP-004): mỗi PR, push main, hằng tuần và chạy tay.
# Khung chỉ dùng thư viện chuẩn lúc chạy; các gói ở đây là công cụ cổng (requirements-dev.txt) và chính pip-audit. Gói E2E (requirements-e2e.txt, D-133) chỉ chạy ở job `app-e2e`.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dep-audit:
    name: dep-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Cài pip-audit và zizmor kèm hash
        run: pip install --quiet --require-hashes -r requirements-audit.txt
      - name: Quét lỗ hổng (đỏ khi có lỗ hổng đã biết)
        run: pip-audit --require-hashes --strict --disable-pip -r requirements-dev.txt -r requirements-audit.txt -r requirements-e2e.txt
      # Lint workflow (CL-5, T-1833): zizmor 1.31.1 chạy offline (không gọi GitHub API, không cần token), persona regular,
      # chỉ đỏ khi có finding mức high; ngoại lệ đã có lý do ngay tại workflow (`# zizmor: ignore[...]`).
      - name: Lint workflow bằng zizmor (đỏ khi có finding high)
        run: zizmor --offline --persona regular --min-severity high .github/workflows
