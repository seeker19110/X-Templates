name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited`: sửa tiêu đề PR thì chạy lại bước kiểm tiêu đề (payload chụp tiêu đề lúc sự kiện; re-run dùng payload cũ).
    types: [opened, synchronize, reopened, edited]

# Mặc định tối thiểu cho MỌI job (GITHUB_TOKEN chỉ đọc). Job nào cần hơn tự khai ở job-level.
permissions:
  contents: read

# PR: push mới hủy run cũ cùng PR. `main`: mỗi commit một group riêng (run_id), không hủy — giữ bằng chứng CI từng commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Số lớp test tối thiểu mà `dev-task.sh test-shard` phải liệt kê được (tổng của bộ test, trước khi chia — một chỗ cho mọi
# shard của `test` và `py311`): discover hỏng/rỗng thì đỏ thay vì xanh với 0 test.
env:
  XT_MIN_TESTS: "100"

jobs:
  # Required check `quality` (job TỔNG HỢP cuối file) + `protection-guard` ở đây; `gitleaks` (secret-scan.yml), `dep-audit`
  # (dep-audit.yml), `merge-gate` (merge-gate.yml, `pull_request_target` — ADR-0023) ở workflow khác. Nguyên tắc: required
  # check phải là job có thật (protection-guard đối chiếu).
  # Fan-out/fan-in (WF-CI-024): mỗi task của `scripts/dev-task.sh gate` (build · typecheck · lint · test) là MỘT job song
  # song gọi đúng `dev-task.sh <task>` (lệnh trong xt.yaml — WF-CI-002); `test` chia 4 shard theo lớp, `coverage` gộp dữ
  # liệu các shard và đòi đúng ngưỡng của `test`; `py311` (sàn hỗ trợ) 3 shard; `checks` (bench + kiểm của repo khung).
  # Wall time ≈ nhánh chậm nhất (test → coverage) thay vì cộng dồn. Test `tests/test_ci.py` giữ cho không trôi: mọi task
  # của `gate` có job, `quality` needs mọi job con và `if: always()`.
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # `xt.py progress-check` cần lịch sử để kiểm SHA bàn giao là tổ tiên HEAD
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # 3.11 = sàn hỗ trợ (3.10 hết hạn 2026-10-01); 3.13 = mặc định. Cài cả hai trong MỖI job để môi trường giống nhau.
          python-version: |
            3.11
            3.13
      - name: Công cụ ghim kèm hash (requirements-dev.txt — khớp xt.yaml)
        run: pip install --quiet --require-hashes -r requirements-dev.txt
      - name: build — đúng lệnh trong xt.yaml
        run: scripts/dev-task.sh build

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # `xt.py progress-check` cần lịch sử để kiểm SHA bàn giao là tổ tiên HEAD
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            3.11
            3.13
      - name: Công cụ ghim kèm hash (requirements-dev.txt — khớp xt.yaml)
        run: pip install --quiet --require-hashes -r requirements-dev.txt
      - name: typecheck — đúng lệnh trong xt.yaml
        run: scripts/dev-task.sh typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # `xt.py progress-check` cần lịch sử để kiểm SHA bàn giao là tổ tiên HEAD
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            3.11
            3.13
      - name: Công cụ ghim kèm hash (requirements-dev.txt — khớp xt.yaml)
        run: pip install --quiet --require-hashes -r requirements-dev.txt
      - name: lint — đúng lệnh trong xt.yaml (validate · link · progress · changelog · ci-check · ruff · shellcheck · JSON)
        run: scripts/dev-task.sh lint

  # Test 3.13 có coverage, 4 shard theo lớp (lớp thứ k của danh sách sắp xếp → shard k mod 4 + 1). Mỗi shard tải dữ liệu
  # `.coverage.*` lên artefact; job `coverage` gộp và đòi 100 % — cùng tập test, cùng ngưỡng với `xt.yaml` `test`.
  test:
    name: test ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false # shard khác vẫn chạy hết để thấy mọi lớp đỏ; kết quả gộp của job vẫn là `failure`
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # `xt.py progress-check` cần lịch sử để kiểm SHA bàn giao là tổ tiên HEAD
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            3.11
            3.13
      - name: Công cụ ghim kèm hash (requirements-dev.txt — khớp xt.yaml)
        run: pip install --quiet --require-hashes -r requirements-dev.txt
      - name: Test shard (coverage ghi vào thư mục tạm của runner)
        env:
          SHARD: ${{ matrix.shard }}
        run: scripts/dev-task.sh test-shard "$SHARD" 4 "$RUNNER_TEMP/cov"
      # actions/upload-artifact, actions/download-artifact: tag mới nhất giải ra SHA commit bằng `git ls-remote` (tag nhẹ),
      # xác minh 2026-10-20. File dữ liệu coverage bắt đầu bằng `.` → cần `include-hidden-files`.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.shard }}
          path: ${{ runner.temp }}/cov/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: coverage
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # `xt.py progress-check` cần lịch sử để kiểm SHA bàn giao là tổ tiên HEAD
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            3.11
            3.13
      - name: Công cụ ghim kèm hash (requirements-dev.txt — khớp xt.yaml)
        run: pip install --quiet --require-hashes -r requirements-dev.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
          path: ${{ runner.temp }}/cov
      - name: Gộp coverage mọi shard, đòi đúng ngưỡng của xt.yaml `test` (100 % dòng + nhánh)
        run: scripts/dev-task.sh test-combine "$RUNNER_TEMP/cov"

  py311:
    name: py311 ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # `xt.py progress-check` cần lịch sử để kiểm SHA bàn giao là tổ tiên HEAD
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            3.11
            3.13
      - name: Công cụ ghim kèm hash (requirements-dev.txt — khớp xt.yaml)
        run: pip install --quiet --require-hashes -r requirements-dev.txt
      # Job `test` chạy trên checkout của PR (HEAD tách rời); test lại trên nhánh tên `main` như CI sau merge — test phụ
      # thuộc nhánh (guard: `git push` không refspec trên `main`) từng xanh ở PR mà đỏ trên `main` (AUD-TEST-005, #124).
      # Liệt kê và chạy bằng python3.11 (`XT_PY`): module lỗi import trên 3.11 → đỏ. Không đo coverage lần hai.
      - name: Test trên Python 3.11 (sàn hỗ trợ), checkout mang tên nhánh `main`
        env:
          SHARD: ${{ matrix.shard }}
          XT_PY: python3.11
        run: |
          set -euo pipefail
          git checkout -q -B main
          test "$(git symbolic-ref --short HEAD)" = main
          scripts/dev-task.sh test-shard "$SHARD" 3

  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # `xt.py progress-check` cần lịch sử để kiểm SHA bàn giao là tổ tiên HEAD

      # Python cố định như các job khác (trước đây job này dùng python hệ thống của runner).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Corpus PR/rollup/review/guard/log CI qua hàm thật của khung (AUTO-07, docs/ops/AUTONOMY-BASELINE.md): exit 1 khi
      # có false-green (máy cho merge/chạy/tính xanh ở ca phải chặn), exit 2 khi corpus hỏng.
      - name: autonomy-bench — đỏ khi false-green > 0 (AUTO-07)
        run: python3 scripts/xt.py autonomy-bench

      - name: Ghép thử blueprint cho MỌI hồ sơ × gói ngành (smoke)
        run: |
          set -euo pipefail
          profiles=$(python3 scripts/xt.py list profiles | awk '{print $1}')
          industries=$(python3 scripts/xt.py list industries | awk '{print $1}')
          n=0
          for p in $profiles; do
            python3 scripts/xt.py compose --profile "$p" --scale M --out "/tmp/bp-$p.md" >/dev/null
            python3 scripts/xt.py blueprint-status "/tmp/bp-$p.md" >/dev/null || true
            n=$((n+1))
          done
          for i in $industries; do
            python3 scripts/xt.py compose --profile web-app --industry "$i" --scale L --include-may --out "/tmp/bp-web-$i.md" >/dev/null
            n=$((n+1))
          done
          echo "OK — ghép $n blueprint"

      - name: Chạy ĐÚNG khối lệnh "Dùng cho một dự án" trong README (cài thử vào dự án rỗng)
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          awk '/^## Dùng cho một dự án/{f=1} f&&/^```bash/{g=1;next} g&&/^```/{exit} g' README.md \
            | grep -v '^git clone' | sed "s#/tmp/x-templates#$PWD#g; s#/đường/dẫn/dự-án#$d#g" \
            | sed '$ s/$/ || test $? -eq 1/' > "$RUNNER_TEMP/readme.sh"   # --strict trả 1 vì blueprint mới chưa tick
          cat "$RUNNER_TEMP/readme.sh"
          bash -euo pipefail "$RUNNER_TEMP/readme.sh"
          test -f "$d/AGENTS.md" && test -f "$d/.claude/settings.json" && test -f "$d/.github/rulesets/main.json"
          echo "OK — lệnh README chạy được"

      - name: Tiêu đề PR theo Conventional Commits, ≤ 72 ký tự (thành tiêu đề squash)
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s' "$TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+$' \
            && [ "${#TITLE}" -le 72 ] || { echo "::error::Tiêu đề PR phải dạng '<type>(scope): mô tả' và ≤ 72 ký tự: $TITLE"; exit 1; }

      - name: Không còn "(đang viết)" / placeholder trong khung
        run: |
          set -euo pipefail
          if grep -rn "(đang viết)" framework/ ; then echo "::error::Còn chỗ đang viết trong framework/"; exit 1; fi
          echo "OK"

  # Required check `quality` (ruleset `.github/rulesets/main.json`): job TỔNG HỢP của mọi job con ở trên (WF-CI-001).
  # `always()` — không phải `!cancelled()`: run bị huỷ (push mới, hết giờ) thì `quality` vẫn chạy và ĐỎ (job con
  # `cancelled`/`skipped` ≠ `success`). Với `!cancelled()`, run bị huỷ làm `quality` thành `skipped`, mà required check
  # `skipped` được GitHub tính là ĐẠT → auto-merge có thể merge mã chưa qua test. Job matrix: `needs.<job>.result` là kết
  # quả gộp (một shard đỏ → `failure`). Thêm job con mà quên `needs` → `tests/test_ci.py` đỏ.
  quality:
    name: quality
    needs: [build, typecheck, lint, test, coverage, py311, checks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Mọi job con phải `success`
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          bad = {job: v.get("result") for job, v in needs.items() if v.get("result") != "success"}
          for job, v in sorted(needs.items()):
              print(f"{job}={v.get('result')}")
          if not needs or bad:
              print(f"::error::Job con không `success`: {bad or 'không có job con nào'}")
              sys.exit(1)
          PY

  # Hàng rào cho hàng rào: (1) mọi required check trong ruleset mẫu phải là job có thật (chặn khoá-nhánh-do-đổi-tên-job);
  # (2) ruleset trên nhánh mặc định có đang hiệu lực không — chỉ CẢNH BÁO (không đỏ) để repo mới chưa import vẫn merge được;
  # muốn bắt buộc, đổi `::warning` thành `exit 1` (xem CONTRIBUTING.md).
  protection-guard:
    name: protection-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Required check trong ruleset ↔ job có thật
        run: |
          set -euo pipefail
          jobs=$(python3 - <<'PY'
          import glob, re
          names = set()
          for f in glob.glob(".github/workflows/*.yml"):
              txt = open(f, encoding="utf-8").read()
              m = re.search(r"^jobs:\n(.*)", txt, re.S | re.M)
              if not m: continue
              for jm in re.finditer(r"^  ([A-Za-z0-9_-]+):\n((?:    .*\n|\n)*)", m.group(1), re.M):
                  key, body = jm.group(1), jm.group(2)
                  nm = re.search(r"^    name:\s*(.+?)\s*$", body, re.M)
                  names.add(nm.group(1).strip('"\'') if nm else key)
          print("\n".join(sorted(names)))
          PY
          )
          fail=0
          for c in $(python3 -c "import json;[print(x['context']) for r in json.load(open('.github/rulesets/main.json'))['rules'] if r['type']=='required_status_checks' for x in r['parameters']['required_status_checks']]"); do
            grep -qx "$c" <<<"$jobs" || { echo "::error::Required check '$c' không khớp job nào trong .github/workflows/"; fail=1; }
          done
          [ "$fail" = 0 ] && echo "OK — mọi required check đều là job có thật."
          exit $fail
      - name: Ruleset trên nhánh mặc định đang hiệu lực? (cảnh báo)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          rules=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/rules/branches/$BRANCH" || echo "[]")
          for t in pull_request required_status_checks deletion non_fast_forward; do
            if ! python3 -c "import json,sys; r=json.loads(sys.argv[1]); sys.exit(0 if any(x.get('type')==sys.argv[2] for x in r) else 1)" "$rules" "$t"; then
              echo "::warning::Nhánh $BRANCH chưa có rule '$t' — import .github/rulesets/main.json (Settings → Rules → Rulesets → Import)."
            fi
          done
          echo "Đã kiểm ruleset (cảnh báo nếu thiếu)."
