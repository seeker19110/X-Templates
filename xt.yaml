# xt.yaml — lệnh chuẩn của repo này cho agent, hook và CI (YAML phẳng `task: lệnh`, đọc bởi scripts/dev-task.sh).
# CI chạy build · typecheck · lint · test bằng ĐÚNG các lệnh dưới đây, mỗi task một job song song (test chia shard qua
# `dev-task.sh test-shard`), job `quality` tổng hợp; local `scripts/dev-task.sh gate` chạy nối tiếp.
# Công cụ ghim kèm hash: requirements-dev.txt (ruff 0.17.1, mypy 2.4.0, coverage 7.16.2 — xem file khoá); shellcheck (CI: ubuntu-latest). Agent KHÔNG suy diễn lệnh từ văn xuôi.
format: python3 -m ruff format scripts tests .claude/hooks
format_file: case {} in *.py) python3 -m ruff format {} ;; esac
lint: python3 scripts/xt.py validate && python3 scripts/check-links.py && python3 scripts/xt.py progress-check && python3 scripts/xt.py changelog-check && python3 scripts/xt.py ci-check && python3 -m ruff check scripts tests .claude/hooks && python3 -m ruff format --check scripts tests .claude/hooks && for f in scripts/*.sh .claude/hooks/*.sh; do bash -n "$f" || exit 1; done && shellcheck --severity=warning scripts/*.sh .claude/hooks/*.sh && python3 -m json.tool .claude/settings.json >/dev/null && python3 -m json.tool .github/rulesets/main.json >/dev/null
typecheck: python3 -m mypy --strict --python-version 3.11 scripts/xt.py scripts/install.py scripts/check-links.py .claude/hooks/guard.py
# test: mỗi LỚP test một tiến trình, chạy song song theo số CPU (D-079): danh sách lớp lấy từ unittest discover (không có
# lớp rỗng → không sinh "Ran 0 tests"; module lỗi import → in lỗi, exit 1; `xargs -r`: danh sách rỗng không chạy gì); coverage parallel=True ghi mỗi tiến trình một file, combine rồi đòi 100 % — cùng
# tập test, cùng ngưỡng, 180 s → ~70 s trên 4 CPU. Một lớp đỏ → xargs exit ≠ 0 → cổng đỏ.
test: d="$(mktemp -d)" && export COVERAGE_FILE="$d/.coverage" && python3 -m coverage erase && python3 -c 'import sys,unittest;S=set();f=lambda s:[f(t) if isinstance(t,unittest.TestSuite) else S.add("tests."+t.__class__.__module__+"."+t.__class__.__name__) for t in s if not isinstance(t,unittest.loader._FailedTest) or print(t._exception,file=sys.stderr) or sys.exit(1)];f(unittest.TestLoader().discover("tests"));print("\n".join(sorted(S)))' | xargs -r -P "$(nproc 2>/dev/null || echo 2)" -n 1 python3 -m coverage run -m unittest && python3 -m coverage combine -q && python3 -m coverage report --fail-under=100; rc=$?; rm -rf "$d"; exit $rc
build: python3 scripts/xt.py stats
# Chia test cho CI song song (`dev-task.sh test-shard I N [DIR]` / `test-combine DIR`, fan-out/fan-in — WF-CI-024):
# test_list = ĐÚNG cách liệt kê lớp của `test` ở trên (test kiểm hai chuỗi trùng nhau), chạy bằng ${XT_PY:-python3} để
# job py311 bắt cả lỗi import trên 3.11; test_unit chạy MỘT lớp ("$1"): có XT_COV_DIR → coverage ghi vào đó, không → không
# đo; test_combine gộp mọi shard rồi đòi đúng ngưỡng của `test` (100 %, cấu hình .coveragerc). `gate`/`test` không đổi.
test_list: "${XT_PY:-python3}" -c 'import sys,unittest;S=set();f=lambda s:[f(t) if isinstance(t,unittest.TestSuite) else S.add("tests."+t.__class__.__module__+"."+t.__class__.__name__) for t in s if not isinstance(t,unittest.loader._FailedTest) or print(t._exception,file=sys.stderr) or sys.exit(1)];f(unittest.TestLoader().discover("tests"));print("\n".join(sorted(S)))'
test_unit: if [ -n "${XT_COV_DIR:-}" ]; then COVERAGE_FILE="$XT_COV_DIR/.coverage" python3 -m coverage run -m unittest "$1"; else "${XT_PY:-python3}" -m unittest "$1"; fi
test_combine: export COVERAGE_FILE="$XT_COV_DIR/.coverage" && python3 -m coverage combine -q && python3 -m coverage report --fail-under=100
# Cổng trước commit (hook pre-bash-guard): fast = `dev-task.sh gate-fast` — lint (gồm format --check) · typecheck ·
# test_fast (chỉ lớp test liên quan file đổi, KHÔNG coverage); cổng đầy đủ `dev-task.sh gate` (ngưỡng 100 %) chạy trước
# khi mở PR và ở CI `quality`. Vắng = full.
commit_gate: fast
# test_fast: `xt.py test-select` đọc XT_CHANGED_FILES (dev-task.sh đặt) → id lớp test liên quan (file không ánh xạ được →
# cả suite), mỗi lớp một tiến trình như `test`. Module test lỗi import → test-select exit 1 → cổng đỏ.
test_fast: python3 scripts/xt.py test-select --unittest | xargs -r -P "$(nproc 2>/dev/null || echo 2)" -n 1 python3 -m unittest
# PR quan trọng riêng của repo khung (D-031 → D-080, chủ repo 2026-10-19): chỉ bộ máy merge/ủy quyền/cổng (`scripts/`) và
# mẫu dự án đích (`framework/templates/` — thành file thật ở dự án đích) và các file PLAN (chứa lệnh Gate mà harness chạy;
# T-1511) vào làn chuẩn. Tài liệu thuần (ADR, luật vòng tự động,
# code-review.md) đi làn nhanh: lớp đỡ là `validate` + `check-links` + revert. Khi ngoại lệ cứng giữ người (ADR-0020) các
# đường dẫn này thành ngoại lệ cứng.
merge_risk_paths: "scripts/*, framework/templates/*, docs/autopilot/PLAN*.md"
# Merge PR (ADR-0013/0014/0015): chủ repo yêu cầu 2026-10-16 "mở PR luôn kèm auto merge" → L3: auto-merge
# của GitHub cho mọi làn — làn nhanh khi mở PR, làn chuẩn sau khi review sạch (ADR-0024) — merge khi required check xanh; L2 = máy chỉ tự merge làn nhanh; L1 = người merge mọi PR.
merge_autonomy: L3
# Ngoại lệ cứng (tiền/dữ liệu thật/auth/mật mã/bí mật): chủ repo chọn 2026-10-17 "bỏ toàn bộ ngoại lệ cứng" → auto =
# agent merge như PR khác (ADR-0020); human = người merge (ADR-0016/0019).
merge_hard_exceptions: auto
# Pha giao hàng (ADR-0031): repo khung giữ `harden` (khai tường minh) — PR làn chuẩn vẫn cần review sạch ở head (ADR-0024).
delivery_phase: harden
# Ghi công AI trong commit (AGENTS.md §3, AUD-HAR-017): forbid = guard chặn commit có tên model/URL phiên AI
# (LOOP-HARNESS-027).
ai_attribution: forbid
